[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-life-agent"
version = "0.1.0"
description = "Local-first terminal MVP for a personal life assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pytest>=8.0",
]

[project.scripts]
life-agent = "life_agent.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["life_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
